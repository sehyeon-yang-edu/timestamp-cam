<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>타임스탬프 카메라</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0b0c;
      color: #ffffff;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* 상단 설정 바 */
    .top-bar {
      width: 100%;
      max-width: 540px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .option-group {
      display: flex;
      background: #1c1c1e;
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .opt-btn {
      background: transparent;
      color: #a1a1aa;
      border: none;
      padding: 6px 12px;
      border-radius: 17px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .opt-btn.active {
      background: #ffffff;
      color: #000000;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-btn.active {
      border-color: #3b82f6;
      transform: scale(1.08);
    }

    /* 1:1 정방형 뷰파인더 영역 */
    .viewfinder-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
    }

    .square-frame {
      position: relative;
      width: min(100vw - 24px, 500px, 62dvh);
      aspect-ratio: 1 / 1;
      background: #18181b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    /* 왼쪽 하단 2열 실시간 타임스탬프 오버레이 */
    .stamp-overlay {
      position: absolute;
      left: 5.5%;
      bottom: 5.5%;
      pointer-events: none;
      line-height: 1.28;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.95);
      letter-spacing: -0.3px;
    }

    .stamp-date {
      font-weight: 800;
      font-size: clamp(18px, 5.2vw, 25px);
    }

    .stamp-time {
      font-weight: 800;
      font-size: clamp(20px, 5.8vw, 28px);
      margin-top: 2px;
    }

    /* 크기 옵션별 프리뷰 스케일 */
    .size-normal .stamp-date { font-size: clamp(16px, 4.5vw, 21px); }
    .size-normal .stamp-time { font-size: clamp(18px, 5.0vw, 24px); }

    .size-large .stamp-date { font-size: clamp(20px, 5.6vw, 27px); }
    .size-large .stamp-time { font-size: clamp(22px, 6.2vw, 30px); }

    .size-xlarge .stamp-date { font-size: clamp(23px, 6.5vw, 31px); }
    .size-xlarge .stamp-time { font-size: clamp(26px, 7.2vw, 35px); }

    /* 촬영 플래시 효과 */
    .flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }

    .flash.active {
      opacity: 0.85;
      transition: none;
    }

    /* 하단 셔터 컨트롤 */
    .bottom-bar {
      width: 100%;
      max-width: 540px;
      height: 120px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-slot {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #thumbPreview {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: none;
      cursor: pointer;
    }

    #shutterBtn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #3f3f46;
      box-shadow: 0 0 0 3px #ffffff;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #shutterBtn:active {
      transform: scale(0.91);
    }

    #switchBtn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1c1c1e;
      color: #ffffff;
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #switchBtn:active {
      background: #2c2c2e;
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28, 28, 30, 0.94);
      color: #fff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 상단 글자 크기 / 색상 조절 -->
  <div class="top-bar">
    <div class="option-group" id="sizeGroup">
      <button class="opt-btn" data-size="normal">보통</button>
      <button class="opt-btn active" data-size="large">크게</button>
      <button class="opt-btn" data-size="xlarge">아주 크게</button>
    </div>

    <div class="option-group" style="padding: 4px 8px; gap: 8px; align-items: center;">
      <button class="color-btn active" data-color="#FFFFFF" style="background:#FFFFFF;" aria-label="흰색"></button>
      <button class="color-btn" data-color="#FACC15" style="background:#FACC15;" aria-label="노란색"></button>
    </div>
  </div>

  <!-- 1:1 카메라 영역 -->
  <div class="viewfinder-wrapper">
    <div class="square-frame size-large" id="squareFrame">
      <video id="video" autoplay playsinline muted></video>
      <div class="stamp-overlay" id="stampOverlay">
        <div class="stamp-date" id="liveDate">2026년 11월 17일 (화)</div>
        <div class="stamp-time" id="liveTime">오후 11:46</div>
      </div>
      <div class="flash" id="flash"></div>
    </div>
  </div>

  <!-- 하단 셔터 및 카메라 전환 -->
  <div class="bottom-bar">
    <div class="side-slot">
      <img id="thumbPreview" alt="최근 촬영" />
    </div>
    <button id="shutterBtn" aria-label="촬영"></button>
    <div class="side-slot">
      <button id="switchBtn" aria-label="전후면 전환" title="카메라 전환">🔄</button>
    </div>
  </div>

  <div class="toast" id="toast">사진이 저장되었습니다</div>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const squareFrame = document.getElementById('squareFrame');
    const stampOverlay = document.getElementById('stampOverlay');
    const liveDateEl = document.getElementById('liveDate');
    const liveTimeEl = document.getElementById('liveTime');
    const shutterBtn = document.getElementById('shutterBtn');
    const switchBtn = document.getElementById('switchBtn');
    const flash = document.getElementById('flash');
    const toast = document.getElementById('toast');
    const thumbPreview = document.getElementById('thumbPreview');

    let facingMode = 'environment'; // 기본 후면 카메라
    let currentStream = null;
    let currentSize = 'large';
    let currentColor = '#FFFFFF';
    let lastImageUrl = null;

    // 한국어 2열 날짜·시간 포맷 생성
    function getKoreanStamp() {
      const now = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayName = days[now.getDay()];

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours < 12 ? '오전' : '오후';
      hours = hours % 12;
      if (hours === 0) hours = 12;

      return {
        dateStr: `${year}년 ${month}월 ${date}일 (${dayName})`,
        timeStr: `${ampm} ${hours}:${minutes}`,
        fileStr: `${year}${String(month).padStart(2, '0')}${String(date).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${minutes}${String(now.getSeconds()).padStart(2, '0')}`
      };
    }

    function updateClock() {
      const { dateStr, timeStr } = getKoreanStamp();
      liveDateEl.textContent = dateStr;
      liveTimeEl.textContent = timeStr;
    }

    setInterval(updateClock, 500);
    updateClock();

    // 글자 크기 선택
    document.querySelectorAll('#sizeGroup .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#sizeGroup .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSize = btn.dataset.size;
        squareFrame.className = `square-frame size-${currentSize}`;
      });
    });

    // 글자 색상 선택
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = btn.dataset.color;
        stampOverlay.style.color = currentColor;
      });
    });

    // 카메라 실행
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1920 }
          },
          audio: false
        });
        video.srcObject = currentStream;
        video.classList.toggle('mirror', facingMode === 'user');
      } catch (err) {
        alert('카메라를 실행할 수 없습니다.\n브라우저 주소창의 카메라 권한을 허용해 주세요.\n(' + err.message + ')');
      }
    }

    switchBtn.addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // 1:1 정방형 촬영 및 타임스탬프 합성 저장
    shutterBtn.addEventListener('click', async () => {
      if (!video.videoWidth || !video.videoHeight) return;

      // 플래시 애니메이션
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 80);

      // 원본 비디오에서 중앙 기준 1:1 정사각형 영역 계산
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const side = Math.min(vw, vh);
      const sx = (vw - side) / 2;
      const sy = (vh - side) / 2;

      canvas.width = side;
      canvas.height = side;
      const ctx = canvas.getContext('2d');

      // 전면 카메라 좌우 반전 보정
      if (facingMode === 'user') {
        ctx.translate(side, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, sx, sy, side, side, 0, 0, side, side);
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // 왼쪽 하단 2열 타임스탬프 그리기
      const { dateStr, timeStr, fileStr } = getKoreanStamp();
      const sizeRatio = currentSize === 'normal' ? 0.044 : currentSize === 'large' ? 0.056 : 0.068;
      const dateFontSize = Math.round(side * sizeRatio);
      const timeFontSize = Math.round(side * (sizeRatio * 1.12));
      const margin = Math.round(side * 0.055);
      const lineGap = Math.round(dateFontSize * 0.28);

      ctx.fillStyle = currentColor;
      ctx.textBaseline = 'bottom';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.92)';
      ctx.shadowBlur = Math.round(dateFontSize * 0.22);
      ctx.shadowOffsetX = Math.max(2, Math.round(side * 0.0025));
      ctx.shadowOffsetY = Math.max(2, Math.round(side * 0.0025));

      // 2열: 시간 (하단 기준선)
      ctx.font = `800 ${timeFontSize}px "Noto Sans KR", -apple-system, sans-serif`;
      const timeY = side - margin;
      ctx.fillText(timeStr, margin, timeY);

      // 1열: 날짜 (시간 바로 위)
      ctx.font = `800 ${dateFontSize}px "Noto Sans KR", -apple-system, sans-serif`;
      const dateY = timeY - timeFontSize - lineGap;
      ctx.fillText(dateStr, margin, dateY);

      // JPG 변환 및 다운로드
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const filename = `TS_${fileStr}.jpg`;

        if (lastImageUrl) URL.revokeObjectURL(lastImageUrl);
        lastImageUrl = URL.createObjectURL(blob);

        thumbPreview.src = lastImageUrl;
        thumbPreview.style.display = 'block';

        const a = document.createElement('a');
        a.href = lastImageUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        showToast('사진이 저장되었습니다');
      }, 'image/jpeg', 0.95);
    });

    // 좌측 하단 썸네일 클릭 시 원본 이미지 새 창 확인 (아이폰 길게 눌러 저장용)
    thumbPreview.addEventListener('click', () => {
      if (lastImageUrl) window.open(lastImageUrl, '_blank');
    });

    startCamera();
  </script>
</body>
</html>
