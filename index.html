<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="타임스탬프" />
  <title>타임스탬프</title>

  <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2318181b'/%3E%3Crect x='76' y='76' width='360' height='360' rx='56' fill='none' stroke='%23ffffff' stroke-width='20' stroke-opacity='0.25'/%3E%3Ccircle cx='256' cy='236' r='88' fill='none' stroke='%23ffffff' stroke-width='28'/%3E%3Ccircle cx='256' cy='236' r='34' fill='%23facc15'/%3E%3Ccircle cx='364' cy='136' r='16' fill='%2322c55e'/%3E%3Crect x='116' y='362' width='180' height='24' rx='12' fill='%23ffffff'/%3E%3Crect x='116' y='398' width='120' height='20' rx='10' fill='%23facc15'/%3E%3C/svg%3E" />
  <link id="appleIcon" rel="apple-touch-icon" href="" />
  <link id="manifestLink" rel="manifest" href="" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0b0c;
      color: #ffffff;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    .top-bar {
      width: 100%;
      max-width: 540px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    .option-group {
      display: flex;
      background: #1c1c1e;
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
      align-items: center;
    }

    .opt-btn {
      background: transparent;
      color: #a1a1aa;
      border: none;
      padding: 6px 10px;
      border-radius: 17px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .opt-btn.active {
      background: #ffffff;
      color: #000000;
    }

    #folderBtn {
      background: #1c1c1e;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 125px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #folderBtn.connected {
      background: rgba(34, 197, 94, 0.16);
      border-color: #22c55e;
      color: #4ade80;
    }

    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-btn.active {
      border-color: #3b82f6;
      transform: scale(1.08);
    }

    .viewfinder-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
    }

    .square-frame {
      position: relative;
      width: min(100vw - 24px, 500px, 62dvh);
      aspect-ratio: 1 / 1;
      background: #18181b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      cursor: crosshair;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    /* 터치 초점 링 애니메이션 */
    .focus-ring {
      position: absolute;
      width: 64px;
      height: 64px;
      border: 2px solid #facc15;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.3);
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
      transition: transform 0.22s ease-out, opacity 0.2s ease;
    }

    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .stamp-overlay {
      position: absolute;
      left: 5.5%;
      bottom: 5.5%;
      pointer-events: none;
      line-height: 1.28;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.95);
      letter-spacing: -0.3px;
    }

    .stamp-date {
      font-weight: 800;
      font-size: clamp(18px, 5.2vw, 25px);
    }

    .stamp-time {
      font-weight: 800;
      font-size: clamp(20px, 5.8vw, 28px);
      margin-top: 2px;
    }

    .size-normal .stamp-date { font-size: clamp(16px, 4.5vw, 21px); }
    .size-normal .stamp-time { font-size: clamp(18px, 5.0vw, 24px); }

    .size-large .stamp-date { font-size: clamp(20px, 5.6vw, 27px); }
    .size-large .stamp-time { font-size: clamp(22px, 6.2vw, 30px); }

    .size-xlarge .stamp-date { font-size: clamp(23px, 6.5vw, 31px); }
    .size-xlarge .stamp-time { font-size: clamp(26px, 7.2vw, 35px); }

    .flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }

    .flash.active {
      opacity: 0.85;
      transition: none;
    }

    .bottom-bar {
      width: 100%;
      max-width: 540px;
      height: 118px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-slot {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #thumbPreview {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: none;
      cursor: pointer;
    }

    #shutterBtn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #3f3f46;
      box-shadow: 0 0 0 3px #ffffff;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #shutterBtn:active {
      transform: scale(0.91);
    }

    #switchBtn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1c1c1e;
      color: #ffffff;
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28, 28, 30, 0.95);
      color: #fff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 30;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <!-- 클릭 시 폴더 연결/해제 토글 (팝업 싫을 땐 해제 가능) -->
    <button id="folderBtn" title="저장 폴더 연결/해제">📥 기본저장</button>

    <div class="option-group" id="sizeGroup">
      <button class="opt-btn" data-size="normal">보통</button>
      <button class="opt-btn active" data-size="large">크게</button>
      <button class="opt-btn" data-size="xlarge">특대</button>
    </div>

    <div class="option-group" style="padding: 4px 7px; gap: 6px;">
      <button class="color-btn active" data-color="#FFFFFF" style="background:#FFFFFF;" aria-label="흰색"></button>
      <button class="color-btn" data-color="#FACC15" style="background:#FACC15;" aria-label="노란색"></button>
    </div>
  </div>

  <div class="viewfinder-wrapper">
    <div class="square-frame size-large" id="squareFrame">
      <video id="video" autoplay playsinline muted></video>
      <div class="focus-ring" id="focusRing"></div>
      <div class="stamp-overlay" id="stampOverlay">
        <div class="stamp-date" id="liveDate">2026년 11월 17일 (화)</div>
        <div class="stamp-time" id="liveTime">오후 11:46</div>
      </div>
      <div class="flash" id="flash"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="side-slot">
      <img id="thumbPreview" alt="최근 촬영" />
    </div>
    <button id="shutterBtn" aria-label="촬영"></button>
    <div class="side-slot">
      <button id="switchBtn" aria-label="전후면 전환" title="카메라 전환">🔄</button>
    </div>
  </div>

  <div class="toast" id="toast">저장되었습니다</div>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    (function setupAppIcon() {
      const iconCanvas = document.createElement('canvas');
      iconCanvas.width = 512;
      iconCanvas.height = 512;
      const ictx = iconCanvas.getContext('2d');

      ictx.fillStyle = '#18181b';
      ictx.beginPath();
      ictx.roundRect(0, 0, 512, 512, 112);
      ictx.fill();

      ictx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ictx.lineWidth = 18;
      ictx.beginPath();
      ictx.roundRect(72, 72, 368, 368, 52);
      ictx.stroke();

      ictx.strokeStyle = '#ffffff';
      ictx.lineWidth = 28;
      ictx.beginPath();
      ictx.arc(256, 230, 86, 0, Math.PI * 2);
      ictx.stroke();

      ictx.fillStyle = '#facc15';
      ictx.beginPath();
      ictx.arc(256, 230, 32, 0, Math.PI * 2);
      ictx.fill();

      ictx.fillStyle = '#22c55e';
      ictx.beginPath();
      ictx.arc(366, 134, 16, 0, Math.PI * 2);
      ictx.fill();

      ictx.fillStyle = '#ffffff';
      ictx.beginPath();
      ictx.roundRect(114, 356, 190, 22, 11);
      ictx.fill();

      ictx.fillStyle = '#facc15';
      ictx.beginPath();
      ictx.roundRect(114, 392, 126, 20, 10);
      ictx.fill();

      const pngDataUrl = iconCanvas.toDataURL('image/png');
      document.getElementById('appleIcon').href = pngDataUrl;

      const manifest = {
        name: '타임스탬프 카메라',
        short_name: '타임스탬프',
        start_url: location.href,
        display: 'standalone',
        background_color: '#0b0b0c',
        theme_color: '#0b0b0c',
        icons: [
          {
            src: pngDataUrl,
            sizes: '512x512',
            type: 'image/png',
            purpose: 'any maskable'
          }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);
    })();

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const squareFrame = document.getElementById('squareFrame');
    const focusRing = document.getElementById('focusRing');
    const stampOverlay = document.getElementById('stampOverlay');
    const liveDateEl = document.getElementById('liveDate');
    const liveTimeEl = document.getElementById('liveTime');
    const shutterBtn = document.getElementById('shutterBtn');
    const switchBtn = document.getElementById('switchBtn');
    const folderBtn = document.getElementById('folderBtn');
    const flash = document.getElementById('flash');
    const toast = document.getElementById('toast');
    const thumbPreview = document.getElementById('thumbPreview');

    let facingMode = 'environment';
    let currentStream = null;
    let videoTrack = null;
    let currentSize = 'large';
    let currentColor = '#FFFFFF';
    let lastImageUrl = null;
    let dirHandle = null;
    let useCustomFolder = localStorage.getItem('useCustomFolder') === 'true';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('TimestampCamDB', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('handles');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveDirHandle(handle) {
      const db = await openDB();
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(handle, 'targetDir');
    }

    async function loadDirHandle() {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('handles', 'readonly');
          const req = tx.objectStore('handles').get('targetDir');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch {
        return null;
      }
    }

    function updateFolderUI() {
      if (useCustomFolder && dirHandle) {
        folderBtn.textContent = `📁 ${dirHandle.name}`;
        folderBtn.classList.add('connected');
      } else {
        folderBtn.textContent = '📥 기본저장';
        folderBtn.classList.remove('connected');
      }
    }

    (async () => {
      const saved = await loadDirHandle();
      if (saved) dirHandle = saved;
      updateFolderUI();
    })();

    // 버튼 클릭 시: 기본저장(팝업 없음) <-> 지정폴더(Diet) 모드 전환
    folderBtn.addEventListener('click', async () => {
      if (!window.showDirectoryPicker) {
        showToast('현재 브라우저는 기본 Download 폴더만 지원합니다');
        return;
      }

      // 이미 지정폴더 모드인 상태에서 누르면 기본저장(팝업 없음)으로 전환
      if (useCustomFolder) {
        useCustomFolder = false;
        localStorage.setItem('useCustomFolder', 'false');
        updateFolderUI();
        showToast('팝업 없는 기본저장(Download) 모드로 전환되었습니다');
        return;
      }

      try {
        if (dirHandle) {
          const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
          if (perm === 'granted') {
            useCustomFolder = true;
            localStorage.setItem('useCustomFolder', 'true');
            updateFolderUI();
            showToast(`'${dirHandle.name}' 폴더 직접 저장이 켜졌습니다`);
            return;
          }
        }
        const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
        dirHandle = handle;
        await saveDirHandle(handle);
        useCustomFolder = true;
        localStorage.setItem('useCustomFolder', 'true');
        updateFolderUI();
        showToast(`'${handle.name}' 폴더가 연결되었습니다`);
      } catch (err) {
        if (err.name !== 'AbortError') {
          alert('Pictures 또는 DCIM 안의 하위 폴더(예: Diet)를 선택해 주세요.');
        }
      }
    });

    function getKoreanStamp() {
      const now = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayName = days[now.getDay()];

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours < 12 ? '오전' : '오후';
      hours = hours % 12;
      if (hours === 0) hours = 12;

      return {
        dateStr: `${year}년 ${month}월 ${date}일 (${dayName})`,
        timeStr: `${ampm} ${hours}:${minutes}`,
        fileStr: `${year}${String(month).padStart(2, '0')}${String(date).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${minutes}${String(now.getSeconds()).padStart(2, '0')}`
      };
    }

    function updateClock() {
      const { dateStr, timeStr } = getKoreanStamp();
      liveDateEl.textContent = dateStr;
      liveTimeEl.textContent = timeStr;
    }

    setInterval(updateClock, 500);
    updateClock();

    document.querySelectorAll('#sizeGroup .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#sizeGroup .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSize = btn.dataset.size;
        squareFrame.className = `square-frame size-${currentSize}`;
      });
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = btn.dataset.color;
        stampOverlay.style.color = currentColor;
      });
    });

    // 연속 오토포커스 적용
    async function applyAutoFocus(track, point = null) {
      if (!track || !track.getCapabilities) return;
      try {
        const caps = track.getCapabilities();
        const advanced = [];

        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          advanced.push({ focusMode: 'continuous' });
        } else if (caps.focusMode && caps.focusMode.includes('auto')) {
          advanced.push({ focusMode: 'auto' });
        }

        if (point && caps.pointsOfInterest) {
          advanced.push({ pointsOfInterest: [point] });
        }

        if (advanced.length > 0) {
          await track.applyConstraints({ advanced });
        }
      } catch (e) {
        // 기기별 미지원 제약조건 무시
      }
    }

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1920 },
            focusMode: { ideal: 'continuous' }
          },
          audio: false
        });
        video.srcObject = currentStream;
        video.classList.toggle('mirror', facingMode === 'user');
        videoTrack = currentStream.getVideoTracks()[0];
        await applyAutoFocus(videoTrack);
      } catch (err) {
        alert('카메라 권한을 허용해 주세요.\n(' + err.message + ')');
      }
    }

    // 뷰파인더 터치 시 초점 링 표시 및 초점 재조정 트리거
    let focusTimer = null;
    squareFrame.addEventListener('click', async (e) => {
      const rect = squareFrame.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.remove('active');
      void focusRing.offsetWidth; // 리플로우로 애니메이션 재시작
      focusRing.classList.add('active');

      clearTimeout(focusTimer);
      focusTimer = setTimeout(() => focusRing.classList.remove('active'), 800);

      if (videoTrack && videoTrack.getCapabilities) {
        const caps = videoTrack.getCapabilities();
        try {
          // 단발 초점(single-shot) 전환 후 다시 연속(continuous)으로 돌아가며 초점 재탐색 유도
          if (caps.focusMode && caps.focusMode.includes('single-shot')) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          }
          await applyAutoFocus(videoTrack, { x: x / rect.width, y: y / rect.height });
        } catch (err) {}
      }
    });

    switchBtn.addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function fallbackDownload(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    shutterBtn.addEventListener('click', () => {
      if (!video.videoWidth || !video.videoHeight) return;

      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 80);

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const side = Math.min(vw, vh);
      const sx = (vw - side) / 2;
      const sy = (vh - side) / 2;

      canvas.width = side;
      canvas.height = side;
      const ctx = canvas.getContext('2d');

      if (facingMode === 'user') {
        ctx.translate(side, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, sx, sy, side, side, 0, 0, side, side);
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      const { dateStr, timeStr, fileStr } = getKoreanStamp();
      const sizeRatio = currentSize === 'normal' ? 0.044 : currentSize === 'large' ? 0.056 : 0.068;
      const dateFontSize = Math.round(side * sizeRatio);
      const timeFontSize = Math.round(side * (sizeRatio * 1.12));
      const margin = Math.round(side * 0.055);
      const lineGap = Math.round(dateFontSize * 0.28);

      ctx.fillStyle = currentColor;
      ctx.textBaseline = 'bottom';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.92)';
      ctx.shadowBlur = Math.round(dateFontSize * 0.22);
      ctx.shadowOffsetX = Math.max(2, Math.round(side * 0.0025));
      ctx.shadowOffsetY = Math.max(2, Math.round(side * 0.0025));

      ctx.font = `800 ${timeFontSize}px "Noto Sans KR", -apple-system, sans-serif`;
      const timeY = side - margin;
      ctx.fillText(timeStr, margin, timeY);

      ctx.font = `800 ${dateFontSize}px "Noto Sans KR", -apple-system, sans-serif`;
      const dateY = timeY - timeFontSize - lineGap;
      ctx.fillText(dateStr, margin, dateY);

      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const filename = `TS_${fileStr}.jpg`;

        if (lastImageUrl) URL.revokeObjectURL(lastImageUrl);
        lastImageUrl = URL.createObjectURL(blob);
        thumbPreview.src = lastImageUrl;
        thumbPreview.style.display = 'block';

        if (useCustomFolder && dirHandle) {
          try {
            let perm = await dirHandle.queryPermission({ mode: 'readwrite' });
            if (perm !== 'granted') {
              perm = await dirHandle.requestPermission({ mode: 'readwrite' });
            }
            if (perm === 'granted') {
              const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
              const writable = await fileHandle.createWritable();
              await writable.write(blob);
              await writable.close();
              showToast(`'${dirHandle.name}' 폴더에 저장되었습니다`);
              return;
            }
          } catch (e) {
            console.error(e);
          }
        }

        fallbackDownload(lastImageUrl, filename);
        showToast('Download 폴더에 저장되었습니다');
      }, 'image/jpeg', 0.95);
    });

    thumbPreview.addEventListener('click', () => {
      if (lastImageUrl) window.open(lastImageUrl, '_blank');
    });

    startCamera();
  </script>
</body>
</html>
